name: Nora
options:
  bundleIdPrefix: io.github.lexus2016
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Nora.xcconfig
  Release: Config/Nora.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  MoleKit:
    path: ../MoleKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"
targets:
  Nora:
    type: application
    platform: macOS
    sources:
      - path: Nora
        excludes:
          - "Info.plist"
          - "Nora.entitlements"
    dependencies:
      - package: MoleKit
      - package: Sparkle
    info:
      path: Nora/Info.plist
      properties:
        CFBundleName: Nora
        CFBundleDisplayName: Nora
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, uk, ru]
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Nora is a GUI for Mole (github.com/tw93/Mole). Not affiliated with Mole."
        NSAppleEventsUsageDescription: "Mole removes an app's login items through System Events and can move files to the Trash through Finder."
        SUFeedURL: https://lexus2016.github.io/Nora/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
    entitlements:
      path: Nora/Nora.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_NAME: Nora
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lexus2016.nora
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        OTHER_CODE_SIGN_FLAGS: "--timestamp"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
  NoraTests:
    type: bundle.unit-test
    platform: macOS
    sources: [NoraTests]
    dependencies:
      - target: Nora
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Developer ID Application"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Nora.app/Contents/MacOS/Nora
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Nora:
    build:
      targets:
        Nora: all
        NoraTests: [test]
    test:
      targets: [NoraTests]
