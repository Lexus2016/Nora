<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Nora — interactive UI prototype of a native macOS GUI for the Mole CLI">
<title>Прототип Nora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: icon rail + a full-bleed neon "scene" per module (colors morph between modules), one live glass object,
   frosted glass panels for results. One deliberate dark neon world (Hotline Miami palette, CleanMyMac structure). */
@property --m1 { syntax: '<color>'; inherits: true; initial-value: #ff3ea5; }
@property --m2 { syntax: '<color>'; inherits: true; initial-value: #6b22d9; }
@property --m3 { syntax: '<color>'; inherits: true; initial-value: #17062f; }
:root{
  --m1:#ff3ea5; --m2:#6b22d9; --m3:#17062f;
  /* How much of the scene's depth colour a card lays down, per module, so card text keeps
     4.5:1 on the brightest glow (the app measures the same values in SceneContrastTests). */
  --scrim:35%;
  --card-fill:linear-gradient(rgba(255,255,255,.07),rgba(255,255,255,.02)),color-mix(in srgb,var(--m3) var(--scrim),transparent);
  --desk:#0a0612; --fg:#ffffff; --fg-2:rgba(255,255,255,.76); --muted:rgba(255,255,255,.54);
  --surface:rgba(255,255,255,.09); --surface-2:rgba(255,255,255,.06); --hover:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.13); --line-2:rgba(255,255,255,.24); --win:#140a26;
  --accent:#ffffff; --accent-fg:#1b1033; --accent-soft:rgba(255,255,255,.16); --accent-text:#ffffff;
  --amber:#ffcf6e; --amber-fill:#ffb02e; --amber-soft:rgba(255,176,46,.2);
  --good:#62f5b5; --warn:#ffd36e; --crit:#ff6b98;
  --good-soft:rgba(98,245,181,.16); --warn-soft:rgba(255,211,110,.17); --crit-soft:rgba(255,107,152,.18);
  --c1:#2ee6d6; --c2:#ffb02e; --c3:#8b97ff; --c4:#ff6b98; --c5:#b9f45f; --c6:#c98bff; --c7:#a3abc0;
  --pink:#ff3ea5; --cyan:#2ee6ff;
  --term-bg:rgba(9,4,20,.78); --term-fg:#ece6ff;
  --f-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Onest", "Segoe UI", sans-serif;
  --f-ui:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Onest", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-num:ui-rounded, "SF Pro Rounded", -apple-system, "Onest", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--fg);font:13.5px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
select option{background:#1b1033;color:#fff}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:8px}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--f-mono);font-size:11.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--fg-2)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.sp{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.grid{display:grid;gap:14px}

/* ---------- stage & prototype bar ---------- */
.stage{height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px 18px;padding-inline:max(16px,2.2vw);position:relative;
  background:radial-gradient(60% 50% at 50% 0%,color-mix(in srgb,var(--m2) 22%,transparent),transparent 70%)}
.chipbtn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-size:12px;color:var(--fg-2)}
.chipbtn:hover{color:#fff;border-color:var(--line-2)}
.chipbtn[aria-pressed="true"]{color:#fff;background:rgba(255,255,255,.16)}
.seg{display:inline-flex;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{padding:4px 10px;border-radius:7px;color:var(--fg-2);font-size:12px}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.18);color:#fff}
.scen{position:absolute;right:0;top:38px;width:min(380px,calc(100vw - 32px));background:rgba(22,12,40,.94);backdrop-filter:blur(20px);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);padding:14px;display:grid;gap:12px;z-index:40}
.scen h4{margin:0;font:500 11px var(--f-display);color:var(--fg-2);letter-spacing:.06em;text-transform:uppercase}
.scen label{font-size:12px;color:var(--fg-2)}


/* macOS menu bar + Nora quick menu */
.macbar{display:flex;align-items:center;gap:14px;height:32px;padding:0 12px;font-size:13px;color:#fff;background:rgba(18,8,34,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:10px;position:relative;z-index:30;white-space:nowrap}
.macbar > span{color:var(--fg-2)} .macbar b{font-weight:700}
.macbar .proto-note{font-size:11px;color:var(--muted)}
.mbitem{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:7px;font-size:12.5px}
.mbitem:hover,.mbitem[aria-pressed="true"]{background:rgba(255,255,255,.18)}
.mbitem img{width:18px;height:18px}
.mbpop{right:calc(max(16px,2.2vw) + 130px)!important;top:46px!important;width:340px!important}
.qm-head{display:flex;align-items:center;gap:10px}
.qm-head img{width:40px;height:40px}
.qm-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qm-stat{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:11px;padding:8px 10px;min-width:0}
.qm-stat small{display:block;color:var(--fg-2);font-size:11px}
.qm-stat b{font:500 15px var(--f-display);font-variant-numeric:tabular-nums}
.qm-call{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:linear-gradient(120deg,rgba(255,62,165,.28),rgba(123,47,247,.28));border:1px solid rgba(255,255,255,.18)}
.qm-nav{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.qm-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;text-align:left;font-size:12.5px;min-width:0}
.qm-row:hover{background:rgba(255,255,255,.12)}
.qm-row img{width:24px;height:24px;flex:none}
.qm-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-2)}
.iconbtn.back-btn{flex:none;color:#fff;align-self:center;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);margin-right:4px;transition:background .15s}
.iconbtn.back-btn:hover{background:rgba(255,255,255,.22)}
.iconbtn.back-btn .ic{width:18px;height:18px;stroke-width:2.2}
.qm-top{display:grid;gap:7px;margin-top:10px}
.seg-sm button{padding:3px 9px;font-size:11.5px}
.qm-meter{display:flex;height:8px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.08)}
.qm-meter i{display:block;height:100%}
.qm-meter .apps{background:linear-gradient(90deg,#2ee6ff,#4f8bff)}
.qm-meter .cache{background:rgba(201,139,255,.55)}
.qm-memline{gap:8px;font-size:12px}
.qm-memline > *{white-space:nowrap}
.qm-item{font-size:12px}
.qm-item .num{font-variant-numeric:tabular-nums}
.qm-track{height:3px;margin-top:4px;border-radius:2px;background:rgba(255,255,255,.07);overflow:hidden}
.qm-track i{display:block;height:100%;border-radius:2px}
.qm-track .mem{background:linear-gradient(90deg,#2ee6ff,#7b2ff7)}
.qm-track .cpu{background:linear-gradient(90deg,#ff5cb4,#ffb02e)}
.inst-steps{display:grid;gap:8px}
.inst-step{display:flex;align-items:center;gap:10px;font-size:13px}
/* ---------- window: the neon scene ---------- */
.window{flex:1;min-height:0;max-height:940px;display:grid;grid-template-columns:84px minmax(0,1fr);border-radius:18px;overflow:hidden;position:relative;isolation:isolate;
  background:
    radial-gradient(55% 75% at 27% 55%,color-mix(in srgb,var(--m1) 58%,transparent),transparent 72%),
    radial-gradient(60% 70% at 95% 0%,color-mix(in srgb,var(--m2) 90%,transparent),transparent 70%),
    linear-gradient(155deg,var(--m2) 0%,var(--m3) 72%);
  transition:--m1 .8s ease,--m2 .8s ease,--m3 .8s ease;
  box-shadow:0 0 0 .5px rgba(255,255,255,.2),0 40px 120px -30px color-mix(in srgb,var(--m1) 45%,#000)}
.window::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.6;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.window::after{content:"";position:absolute;left:28%;right:28%;bottom:-150px;height:280px;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--m1) 75%,transparent),transparent);filter:blur(8px);opacity:.75}

/* rail */
.rail{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;border-right:1px solid rgba(255,255,255,.08);background:rgba(8,3,20,.22)}
.traffic{display:flex;gap:7px;margin:3px 0 20px}
.traffic i{width:12px;height:12px;border-radius:50%;background:#ff5f57}
.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}
.rail-btn{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;position:relative;color:var(--fg-2);transition:background .2s,transform .2s}
.rail-btn img{width:38px;height:38px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.rail-btn .ic{width:22px;height:22px}
.rail-btn:hover{background:rgba(255,255,255,.08)}
.rail-btn[aria-current="page"]{background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.24),0 10px 24px -10px rgba(0,0,0,.6)}
.rail-btn .tip{position:absolute;left:64px;white-space:nowrap;background:rgba(18,9,34,.95);border:1px solid var(--line);padding:5px 10px;border-radius:8px;font-size:12px;color:#fff;opacity:0;pointer-events:none;transform:translateX(-4px);transition:.15s;z-index:50}
.rail-btn:hover .tip,.rail-btn:focus-visible .tip{opacity:1;transform:none}
.rail-btn .dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--pink);box-shadow:0 0 10px var(--pink)}
.rail .gap{flex:1}

/* content */
.content{position:relative;z-index:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 16px 0;min-height:50px}
.topbar .where{font:500 12px var(--f-display);letter-spacing:.04em;color:var(--fg-2)}
.pillbtn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 13px;border-radius:17px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;font-size:12.5px;white-space:nowrap}
.pillbtn:hover{background:rgba(255,255,255,.16)}
.pillbtn.on{background:rgba(98,245,181,.18);border-color:rgba(98,245,181,.4)}
.pillbtn[aria-pressed="true"]{background:rgba(255,255,255,.2)}
.kbd{font:500 10.5px var(--f-mono);padding:1px 5px;border-radius:4px;border:1px solid var(--line-2);color:var(--fg-2)}
.banners:empty{display:none}
.banners{display:grid;gap:6px;padding:10px 18px 0}
.banner{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:12px;font-size:12.5px;background:rgba(255,211,110,.14);border:1px solid rgba(255,211,110,.3)}
.banner .ic{color:var(--warn)}
main{flex:1;overflow:auto;padding:14px 22px 22px;min-height:0;position:relative}

/* ---------- landing (CleanMyMac-like module screen) ---------- */
.landing{min-height:100%;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;gap:20px;padding:0 18px 150px}
.landing .hero3d{width:min(420px,100%);aspect-ratio:1;justify-self:center}
.title{font:500 clamp(30px,3.8vw,48px)/1.1 var(--f-display);margin:0 0 14px;letter-spacing:-.01em;text-wrap:balance;text-shadow:0 0 34px color-mix(in srgb,var(--m1) 60%,transparent)}
.lead{font-size:16px;line-height:1.5;color:var(--fg-2);max-width:44ch;margin:0 0 26px}
.bullets{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.bullets li{display:flex;align-items:center;gap:14px;font-size:15px;font-weight:600}
.bico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:linear-gradient(160deg,color-mix(in srgb,var(--m1) 70%,#fff 30%),color-mix(in srgb,var(--m1) 60%,var(--m2)));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 18px -8px rgba(0,0,0,.6)}
.bico .ic{width:20px;height:20px;color:#fff}
.land-opts{display:grid;gap:10px;margin-top:24px;max-width:420px}
.land-opt{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.status-line{font-size:15px;color:var(--fg-2);margin:0 0 18px;display:flex;align-items:center;gap:10px}
.scan-wrap{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:3;display:grid;justify-items:center;gap:8px}
.scan-btn{position:relative;width:122px;height:122px;border-radius:50%;font:600 15.5px var(--f-ui);color:#fff;
  background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--m1) 70%,#fff 30%),var(--m1) 52%,color-mix(in srgb,var(--m1) 50%,var(--m2)));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 0 0 9px rgba(255,255,255,.07),0 0 70px color-mix(in srgb,var(--m1) 75%,transparent);transition:transform .2s}
.scan-btn:hover{transform:scale(1.04)}
.scan-btn::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(255,255,255,.4);animation:pulse 2.6s ease-out infinite}
.scan-btn.busy{background:radial-gradient(circle,rgba(20,8,40,.55) 58%,transparent 59%),conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.18) 0)}
.scan-btn.busy::after{animation:none;border-color:transparent}
.scan-sub{font-size:12px;color:var(--fg-2)}
.scan-wrap.inline{position:relative;left:auto;bottom:auto;transform:none;margin:30px auto 8px;width:max-content}
@keyframes pulse{from{transform:scale(.9);opacity:.8}to{transform:scale(1.22);opacity:0}}

/* ---------- glass panels & primitives ---------- */
.panel,.card{background:var(--card-fill);border:1px solid rgba(255,255,255,.15);border-radius:20px;backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 30px 60px -34px rgba(0,0,0,.6);min-width:0}
.card{padding:18px;border-radius:18px}
.panel{padding:22px}
.card h3{margin:0;font:600 14px var(--f-ui)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.eyebrow{font:500 10.5px var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2)}
.res-head{display:flex;align-items:center;gap:16px;margin:0 0 16px;flex-wrap:wrap}
.res-head .hero3d{width:96px;height:96px}
.res-title{font:500 26px/1.15 var(--f-display);margin:0;text-wrap:balance}
.res-head p{margin:4px 0 0;color:var(--fg-2)}
.bigstat{font:500 42px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bigv{font:500 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.bigv small{font:500 13px var(--f-ui);color:var(--fg-2);margin-left:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 15px;border-radius:11px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-weight:600;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.primary{background:#fff;color:#1b1033;border-color:transparent}
.btn.primary:hover{background:#f1ecff}
.btn.danger{background:linear-gradient(160deg,#ff5c9a,#e2266f);border-color:transparent;color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg-2)}
.btn.ghost:hover{background:rgba(255,255,255,.1);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:9px}
.btn[disabled]{opacity:.4;pointer-events:none}
.cmd{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--f-mono);color:var(--fg-2);background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:7px;padding:2px 8px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd::before{content:"$";color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:10px;white-space:nowrap}
.pill .ic{width:12px;height:12px}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.info{background:rgba(46,230,255,.16);color:var(--cyan)}
.pill.neutral{background:rgba(255,255,255,.1);color:var(--fg-2)} .pill.amber{background:var(--amber-soft);color:var(--amber)}
.tag{font:500 10.5px var(--f-mono);padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--fg-2);border:1px solid var(--line)}
.hr{height:1px;background:var(--line);margin:14px 0}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:3px;background:#fff}
.cb{appearance:none;width:17px;height:17px;border-radius:5px;border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.06);display:inline-grid;place-content:center;flex:none;cursor:pointer;margin:0}
.cb:checked,.cb:indeterminate{background:#fff;border-color:#fff}
.cb:checked::after{content:"";width:8px;height:4.5px;border:2px solid #1b1033;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.cb:indeterminate::after{content:"";width:8px;height:2px;background:#1b1033;border-radius:1px}
.cb:disabled{opacity:.35;cursor:not-allowed}
.sw{appearance:none;width:34px;height:20px;border-radius:10px;background:rgba(255,255,255,.2);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.sw:checked{background:linear-gradient(90deg,var(--pink),#b04dff)} .sw:checked::after{transform:translateX(14px)}
.field{height:34px;border-radius:11px;border:1px solid var(--line-2);background:rgba(255,255,255,.08);padding:0 12px;min-width:0}
.field::placeholder{color:var(--muted)}
.tabs{display:inline-flex;gap:2px;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:11px;padding:3px}
.tabs button{padding:5px 12px;border-radius:8px;color:var(--fg-2);font-size:12.5px}
.tabs button[aria-selected="true"]{background:rgba(255,255,255,.18);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv dt{color:var(--fg-2)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--fg-2);line-height:1.5}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--fg-2)}
.iconbtn:hover{background:rgba(255,255,255,.12);color:#fff}
.empty{padding:28px;text-align:center;color:var(--muted)}
.actionbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding:12px 16px;border-radius:16px;background:rgba(10,4,24,.4);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:sticky;bottom:0;z-index:2}
.actionbar .tot{font:500 17px var(--f-display);font-variant-numeric:tabular-nums}
.legend{display:grid;gap:6px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend s{width:9px;height:9px;border-radius:3px;flex:none;text-decoration:none}
.catbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:rgba(255,255,255,.08)}
.catbar i{display:block;height:100%}
.opt-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.opt-row:first-child{border-top:0}

/* lists */
.list{border-radius:16px;overflow:hidden;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.sticky{position:sticky;top:0}
.sec{border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);overflow:hidden}
.sec + .sec{margin-top:8px}
.sec-h{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.sec-h:hover{background:var(--hover)}
.sec-h .chev{transition:transform .15s;color:var(--fg-2)}
.sec.open .sec-h .chev{transform:rotate(90deg)}
.sec-h h4{margin:0;font-weight:600;font-size:13.5px}
.sec-h .sz{font-weight:600;font-variant-numeric:tabular-nums}
.sec-b{display:none;border-top:1px solid var(--line)}
.sec.open .sec-b{display:block}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto 56px;gap:2px 10px;align-items:center;padding:8px 14px 8px 40px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item:hover{background:var(--hover)}
.item .path{grid-column:2/4;font:400 11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .lbl{font-weight:500}
.item .sz{font-variant-numeric:tabular-nums;text-align:right;color:var(--fg-2)}
.item .acts{display:flex;gap:2px;justify-content:flex-end;opacity:0;transition:opacity .12s}
.item:hover .acts,.item:focus-within .acts{opacity:1}
.locked{display:flex;gap:12px;align-items:center;padding:14px;background:rgba(0,0,0,.15)}
.app{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer}
.app:first-child{border-top:0}
.app:hover{background:var(--hover)}
.app.focus{background:rgba(255,255,255,.12)}
.appico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font:600 13px var(--f-ui);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 10px -4px rgba(0,0,0,.5);flex:none}
.appico.lg{width:54px;height:54px;border-radius:14px;font-size:19px}
.app .meta{font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.app .sz{font-variant-numeric:tabular-nums;color:var(--fg-2);text-align:right}
.fgroup{padding:8px 0;border-top:1px solid var(--line)}
.fgroup:first-child{border-top:0}
.fgroup h5{margin:0 0 4px;font-size:12px;color:var(--fg-2);display:flex;gap:8px}
.fgroup .p{font:400 11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 0}
.proj + .proj{margin-top:8px}
.proj{border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);overflow:hidden}
.proj-h{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.05);border-bottom:1px solid var(--line)}
.art{display:grid;grid-template-columns:auto 120px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.art:first-of-type{border-top:0}
.inst{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:2px 12px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.inst:first-child{border-top:0}
.ftype{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font:600 10px var(--f-mono);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}

/* analyze */
.an{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:12.5px}
.crumbs button{padding:4px 8px;border-radius:8px;color:var(--fg-2)}
.crumbs button:hover{background:var(--hover);color:#fff}
.crumbs button:last-child{color:#fff;font-weight:600}
.sun{width:100%;max-width:440px;margin:0 auto;display:block;aspect-ratio:1}
.sun path{cursor:pointer;transition:opacity .15s}
.sun path:hover{opacity:.82}
.sun .center{cursor:pointer}
.tm text{pointer-events:none}
.tm rect.hit{cursor:pointer}
.tm rect.hit:hover{stroke:#fff;stroke-width:1.5}
.entry{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.entry:hover{background:var(--hover)}
.entry .bar{grid-column:2/4;height:4px}
.sw-dot{width:10px;height:10px;border-radius:3px}

/* status & dashboards */
.st{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.st .w2{grid-column:span 2} .st .w3{grid-column:span 3} .st .w4{grid-column:span 4} .st .w6{grid-column:span 6}
.cores{display:grid;grid-template-columns:repeat(auto-fill,minmax(16px,1fr));gap:4px;align-items:end;height:46px}
.cores i{display:block;border-radius:3px 3px 1px 1px;background:linear-gradient(0deg,var(--pink),#ff8ac6);min-height:3px}
.cores i.e{background:linear-gradient(0deg,#4a7dff,var(--cyan))}
.ptable{width:100%;border-collapse:collapse;font-size:12.5px}
.ptable th{font-weight:500;color:var(--muted);text-align:left;font-size:11.5px;padding:0 8px 6px}
.ptable td{padding:7px 8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.ptable td.r,.ptable th.r{text-align:right}
.tablewrap{overflow-x:auto}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;text-align:center;line-height:1.1}
.ring .rv b{font:500 22px var(--f-display);font-variant-numeric:tabular-nums;display:block}
.ring .rv small{font-size:10.5px;color:var(--fg-2)}
.dash{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}
.dash .big{grid-row:span 2}
.tiles4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:18px;background:var(--card-fill);border:1px solid var(--line);text-align:left;transition:transform .15s,background .15s;min-width:0}
.tile:hover{background:rgba(255,255,255,.13);transform:translateY(-2px)}
.tile img{width:58px;height:58px;margin:-4px 0 2px -4px}
.tile b{font:500 22px var(--f-display);font-variant-numeric:tabular-nums}
.tile small{color:var(--fg-2)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.tool{display:flex;flex-direction:column;gap:6px;padding:18px;min-height:190px}
.tool img{width:54px;height:54px;margin:-6px 0 4px -6px}
.tool h3{font-size:15px}
.tool p{margin:0;color:var(--fg-2);font-size:12.5px;line-height:1.5;flex:1}
.tool .foot{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:10px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .d{grid-column:2;font-size:12px;color:var(--muted)}
.hist-chart{width:100%;height:auto;display:block}
.sess{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:3px 12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);cursor:pointer}
.sess:first-child{border-top:0}
.sess:hover{background:var(--hover)}
.cmdi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.1);grid-row:span 2}
.oplog{grid-column:1/-1;margin-top:8px;background:rgba(0,0,0,.3);border-radius:10px;padding:10px 12px;font:400 11px/1.6 var(--f-mono);overflow-x:auto;white-space:pre;color:var(--term-fg)}
.set-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.set-row:first-of-type{border-top:0}
.set-row .t{flex:1;min-width:0}
.set-row .t b{font-weight:600;display:block}
.set-row .t small{color:var(--fg-2);font-size:12px}
.caps{display:flex;flex-wrap:wrap;gap:6px}
.done{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center;gap:20px;min-height:420px}
.done .hero3d{width:min(320px,100%);aspect-ratio:1;justify-self:center}

/* hero canvas */
.hero3d{position:relative;flex:none;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s ease-out}
.hero3d img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;filter:drop-shadow(0 28px 36px rgba(0,0,0,.45));animation:float 6s ease-in-out var(--d6,0s) infinite}
.hero3d[data-state="work"] img{animation:float 1.4s ease-in-out var(--d14,0s) infinite,glow 1.1s ease-in-out var(--d11,0s) infinite}
.hero3d[data-state="done"] img{animation:pop .8s cubic-bezier(.2,1.6,.4,1) 1,float 6s ease-in-out .8s infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-10px) rotate(1.2deg)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 28px 36px rgba(0,0,0,.45)) brightness(1)}50%{filter:drop-shadow(0 0 46px color-mix(in srgb,var(--m1) 85%,transparent)) brightness(1.18)}}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.07)}100%{transform:scale(1)}}

/* drawer, sheets, palette, menubar, toast */
.drawer{border-top:1px solid var(--line);background:var(--term-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--term-fg);height:220px;display:flex;flex-direction:column;flex:none;position:relative;z-index:4}
.drawer-h{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);font-size:12px}
.drawer-b{flex:1;overflow:auto;padding:10px 16px;font:400 11.5px/1.65 var(--f-mono);white-space:pre-wrap;word-break:break-word}
.drawer-b .g{color:var(--good)} .drawer-b .w{color:var(--warn)} .drawer-b .a{color:var(--cyan)} .drawer-b .m{color:var(--muted)} .drawer-b .h{color:#fff;font-weight:600}
.scrim{position:absolute;inset:0;background:rgba(6,2,14,.45);backdrop-filter:blur(3px);display:grid;place-items:start center;padding:60px 16px 16px;z-index:20;overflow:auto}
.sheet{width:min(520px,100%);background:rgba(30,16,56,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid var(--line-2);border-radius:20px;box-shadow:0 40px 80px -20px rgba(0,0,0,.7);padding:22px;display:grid;gap:14px}
.sheet h3{margin:0;font:500 18px/1.25 var(--f-display);text-wrap:balance}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.auth{display:flex;gap:14px;align-items:center;padding:13px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.auth .fp{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(160deg,var(--pink),#9b3dff);color:#fff;flex:none}
.auth .fp .ic{width:24px;height:24px}
.palette{width:min(560px,100%);background:rgba(30,16,56,.94);backdrop-filter:blur(30px);border:1px solid var(--line-2);border-radius:18px;box-shadow:0 40px 80px -20px rgba(0,0,0,.7);overflow:hidden}
.palette input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:15px 18px;font-size:15px;outline:none}
.palette input::placeholder{color:var(--muted)}
.pal-li{display:flex;align-items:center;gap:10px;width:100%;padding:9px 18px;text-align:left}
.pal-li:hover,.pal-li.on{background:rgba(255,255,255,.12)}
.pal-li .cmd{margin-left:auto}
.mbpop{position:absolute;top:44px;right:max(16px,2.2vw);width:300px;background:rgba(30,16,56,.9);backdrop-filter:blur(30px) saturate(1.5);-webkit-backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--line-2);border-radius:16px;box-shadow:0 30px 60px -20px rgba(0,0,0,.7);padding:13px;display:grid;gap:10px;z-index:35}
.mb-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mb-cell{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:11px;padding:8px 10px}
.mb-cell b{font:500 15px var(--f-display);font-variant-numeric:tabular-nums}
.mb-cell small{display:block;color:var(--fg-2);font-size:11px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#1b1033;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;z-index:60;box-shadow:0 20px 40px -10px rgba(0,0,0,.6);max-width:calc(100vw - 32px)}
.fade-in{animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
main.noanim .fade-in{animation:none}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}


/* ---------- polish layer: typography & controls tuned to the glass art ---------- */
body{font-size:14px;letter-spacing:-.005em;text-rendering:optimizeLegibility;font-feature-settings:"kern","liga"}
.title{font:300 clamp(34px,4.3vw,56px)/1.06 var(--f-display);letter-spacing:-.025em;
  background:linear-gradient(180deg,#fff 30%,color-mix(in srgb,#fff 72%,var(--m1)) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px color-mix(in srgb,var(--m1) 45%,transparent));text-shadow:none}
.lead{font:400 17px/1.5 var(--f-ui);letter-spacing:-.01em;color:rgba(255,255,255,.78)}
.bullets li{font:600 15.5px/1.3 var(--f-ui);letter-spacing:-.01em}
.res-title{font:400 30px/1.12 var(--f-display);letter-spacing:-.02em}
.eyebrow{font:600 11px/1 var(--f-ui);letter-spacing:.11em;color:rgba(255,255,255,.62)}
.bigstat,.bigv,.tile b,.mb-cell b,.qm-stat b,.ring .rv b,.actionbar .tot{font-family:var(--f-num);font-weight:600;letter-spacing:-.02em}
.bigstat{font-size:46px}
.card h3,.sec-h h4{font-weight:600;letter-spacing:-.01em}
.macbar b,.pb-brand b{font-family:var(--f-ui)}
/* glass panels with a top light edge */
.panel,.card{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.055));border:1px solid rgba(255,255,255,.17);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.12),0 30px 60px -34px rgba(0,0,0,.65)}
.list,.sec,.proj{background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.045));box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
/* buttons */
.btn{height:36px;padding:0 16px;border-radius:12px;font:600 13.5px/1 var(--f-ui);letter-spacing:-.005em;
  background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.09));border:1px solid rgba(255,255,255,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 6px 16px -8px rgba(0,0,0,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transition:transform .12s ease,box-shadow .2s ease,background .2s ease}
.btn:hover{background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.14))}
.btn:active{transform:translateY(1px) scale(.99);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 8px -6px rgba(0,0,0,.6)}
.btn.primary{background:linear-gradient(180deg,#ffffff 0%,#f3eeff 60%,#e6defb 100%);color:#1b1033;border-color:rgba(255,255,255,.9);
  box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(27,16,51,.08),0 10px 26px -10px color-mix(in srgb,var(--m1) 75%,transparent)}
.btn.primary:hover{background:linear-gradient(180deg,#fff,#f7f3ff 60%,#ece5ff);box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 rgba(27,16,51,.08),0 14px 32px -10px color-mix(in srgb,var(--m1) 85%,transparent)}
.btn.danger{background:linear-gradient(180deg,#ff7bb3 0%,#ff3d8c 55%,#d81b63 100%);border-color:rgba(255,190,220,.6);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 26px -10px rgba(255,61,140,.8)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;backdrop-filter:none}
.btn.sm{height:30px;padding:0 12px;border-radius:10px;font-size:12.5px}
.pillbtn{background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 16px -10px rgba(0,0,0,.5)}
/* the round scan button: a glass orb */
.scan-btn{font:600 16px/1.1 var(--f-ui);letter-spacing:-.01em;text-shadow:0 1px 8px rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.65);
  background:
    radial-gradient(70% 45% at 50% 8%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%),
    radial-gradient(circle at 50% 78%,color-mix(in srgb,var(--m1) 70%,#fff 30%),var(--m1) 46%,color-mix(in srgb,var(--m1) 45%,var(--m2)) 100%);
  box-shadow:inset 0 -10px 24px color-mix(in srgb,var(--m2) 55%,transparent),inset 0 2px 0 rgba(255,255,255,.6),0 0 0 10px rgba(255,255,255,.06),0 18px 40px -12px rgba(0,0,0,.6),0 0 80px color-mix(in srgb,var(--m1) 70%,transparent)}
.scan-btn:active{transform:scale(.97)}
.scan-sub{font:500 12px var(--f-ui);color:rgba(255,255,255,.7)}
/* bullet icons: small glossy tiles */
.bico{border:1px solid rgba(255,255,255,.4);
  background:radial-gradient(80% 60% at 50% 0%,rgba(255,255,255,.55),rgba(255,255,255,0) 70%),linear-gradient(160deg,color-mix(in srgb,var(--m1) 75%,#fff 25%),color-mix(in srgb,var(--m1) 55%,var(--m2)));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -6px 12px color-mix(in srgb,var(--m2) 40%,transparent),0 10px 20px -10px rgba(0,0,0,.6)}
.bico .ic{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));stroke-width:2}
/* segmented controls */
.tabs{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.tabs button{font:500 12.5px var(--f-ui);border-radius:9px;padding:6px 13px;transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.14));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 10px -6px rgba(0,0,0,.6)}
/* switches & checkboxes */
.sw{background:rgba(0,0,0,.28);box-shadow:inset 0 1px 3px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.12)}
.sw::after{background:linear-gradient(180deg,#fff,#ece6fb);box-shadow:0 2px 5px rgba(0,0,0,.35),inset 0 -1px 0 rgba(0,0,0,.08)}
.sw:checked{background:linear-gradient(90deg,var(--pink),#a34dff);box-shadow:inset 0 1px 2px rgba(0,0,0,.25),0 0 14px rgba(255,62,165,.55)}
.cb{border-radius:6px;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.cb:checked,.cb:indeterminate{background:linear-gradient(180deg,#fff,#ece6fb);box-shadow:0 0 10px rgba(255,255,255,.35)}
.field{background:rgba(0,0,0,.2);border-color:rgba(255,255,255,.18);box-shadow:inset 0 1px 2px rgba(0,0,0,.3);font:400 13.5px var(--f-ui)}
.pill{font:600 11px var(--f-ui);letter-spacing:.01em}
/* rail */
.rail-btn img{width:40px;height:40px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.rail-btn[aria-current="page"]{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 1px rgba(255,255,255,.18),0 10px 24px -10px rgba(0,0,0,.6)}
.tile img{width:72px;height:72px;margin:-8px 0 0 -8px}
.tool img{width:64px;height:64px;margin:-8px 0 2px -8px}
.qm-row img{width:28px;height:28px}
.qm-head img{width:44px;height:44px}
.mbitem img{width:20px;height:20px}

/* responsive */
@media (max-width:1180px){ .dash{grid-template-columns:1fr 1fr} .dash .big{grid-row:auto;grid-column:span 2} .st{grid-template-columns:repeat(2,minmax(0,1fr))} .st .w2,.st .w3,.st .w4,.st .w6{grid-column:span 2} .tiles4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:980px){ .split,.an,.done{grid-template-columns:1fr} .sticky{position:static} .landing{grid-template-columns:1fr;padding-bottom:160px} .landing .hero3d{width:min(300px,80%)} }
@media (max-width:820px){
  html,body{height:auto} .stage{height:auto}
  .window{grid-template-columns:1fr;max-height:none}
  .rail{flex-direction:row;justify-content:flex-start;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid rgba(255,255,255,.08)}
  .traffic{display:none} .rail .gap{display:none}
  .rail-btn{width:46px;height:46px;flex:none} .rail-btn img{width:32px;height:32px} .rail-btn .tip{display:none}
  main{overflow:visible;padding:12px 16px 18px}
  .topbar{flex-wrap:wrap;padding:10px 12px 0} .topbar .where{display:none}
  .landing{padding:0 0 170px}
  .dash{grid-template-columns:1fr} .dash .big{grid-column:auto}
  .st{grid-template-columns:1fr} .st .w2,.st .w3,.st .w4,.st .w6{grid-column:auto}
  .item{padding-left:14px}
  .art{grid-template-columns:auto minmax(0,1fr) auto} .art .path,.art .flag{display:none}
  .inst{grid-template-columns:auto minmax(0,1fr) auto} .inst .ftype,.inst .src{display:none}
  .actionbar{position:static}
  .mbpop{position:fixed!important;top:auto!important;bottom:16px;left:16px;right:16px!important;width:auto!important}
  .macbar > span:not(#clock),.macbar .proto-note{display:none}
}
</style>

<div class="stage" id="stage">
  <header class="macbar">
    <b>Nora</b><span>Файл</span><span>Правка</span><span>Вигляд</span><span>Вікно</span><span>Довідка</span>
    <span class="sp"></span>
    <span class="proto-note">прототип · демо-дані</span>
    <button class="chipbtn" data-a="toggleScen" id="scenBtn" aria-pressed="false"><svg class="ic"><use href="#i-settings"/></svg>Сценарії</button>
    <button class="mbitem" data-a="toggleMb" id="mbBtn" aria-pressed="false" title="Nora у рядку меню"><img id="mbIco" alt=""><span id="mbCpu" class="num">24 %</span></button>
    <svg class="ic" aria-hidden="true"><use href="#i-net"/></svg><svg class="ic" aria-hidden="true"><use href="#i-battery"/></svg>
    <span id="clock" class="num"></span>
    <div class="scen" id="scen" hidden></div>
  </header>

  <div class="window" id="win">
    <aside class="rail" id="rail" aria-label="Розділи"></aside>
    <section class="content">
      <div class="topbar">
        <span class="where" id="where"></span><span class="sp"></span>
        <span id="adminPill"></span>
        <button class="pillbtn" data-a="palette" title="Команди"><svg class="ic"><use href="#i-search"/></svg><span class="kbd">⌘K</span></button>
        <button class="pillbtn" data-a="drawer" id="drawerBtn" aria-pressed="false" title="Консоль Mole"><svg class="ic"><use href="#i-term"/></svg></button>
      </div>
      <div class="banners" id="banners"></div>
      <main id="main" tabindex="-1"></main>
      <div class="drawer" id="drawer" hidden>
        <div class="drawer-h">
          <svg class="ic"><use href="#i-term"/></svg>
          <span class="mono ell" id="drawerCmd" style="flex:1"></span>
          <span id="drawerState" class="muted"></span>
          <button class="btn ghost sm" data-a="copyCmd"><svg class="ic"><use href="#i-copy"/></svg>Копіювати</button>
          <button class="btn ghost sm" data-a="stopRun" id="stopBtn" hidden><svg class="ic"><use href="#i-stop"/></svg>Зупинити</button>
          <button class="iconbtn" data-a="drawer" aria-label="Закрити консоль"><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
        <div class="drawer-b" id="drawerBody"></div>
      </div>
    </section>
    <div class="scrim" id="sheet" hidden><div class="sheet fade-in" id="sheetBody" role="dialog" aria-modal="true"></div></div>
    <div class="scrim" id="palette" hidden><div class="palette fade-in" role="dialog" aria-label="Команди">
      <input id="palInput" placeholder="Що зробити? Наприклад: очистити, аналіз Downloads, Touch ID…" autocomplete="off">
      <div id="palList" style="max-height:340px;overflow:auto;padding:6px 0"></div>
    </div></div>
  </div>
  <div class="mbpop fade-in" id="mbPop" hidden></div>
  <div class="mbpop" id="mbMenu" hidden style="width:240px!important;padding:6px;gap:0"></div>
  <div class="toast" id="toast" hidden></div>
</div>
